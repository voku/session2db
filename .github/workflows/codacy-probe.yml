name: Temporary Codacy issue evidence probe

on:
  push:
    branches: ['ci/mysql-phpunit-baseline-20261101']
    paths: ['.github/workflows/codacy-probe.yml']

permissions:
  contents: read

jobs:
  read-public-codacy-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read public Codacy PR findings
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/session2db/pull-requests/23/issues?status=new&limit=100'
          echo 'Reading publicly documented Codacy v3 endpoint for voku/session2db PR #23.'
          curl --fail-with-body --silent --show-error --location --retry 2 \
            --connect-timeout 10 --max-time 35 \
            -H 'Accept: application/json' "$url" | jq .
